; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = 
    config/secrets.ini

[common]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.flash_type = qio_opi
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../TMP-API

build_flags =
    -Wall
    -Wextra
    -D WIFI_SSID=\"${secret.wifi_ssid}\"
    -D WIFI_PASS=\"${secret.wifi_password}\"
    -D OTA_PASSWORD=\"${secret.ota_upload_password}\"

[debug]
extends = common
build_flags =
    ${common.build_flags}
    -D CORE_DEBUG_LEVEL=4
    -D DEBUG_MODE
[usb]
upload_protocol = esptool

[ota]
upload_protocol = espota
upload_port = TMP-ESP32.local
upload_flags =
    --auth=${secret.ota_upload_password}

[env:esp32_s3_devkitc_1_usb]
extends = common, usb

[env:debug_esp32_s3_devkitc_1_usb]
extends = debug, usb

[env:esp32_s3_devkitc_1_ota]
extends = common, ota

[env:debug_esp32_s3_devkitc_1_ota]
extends = debug, ota 
